<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Melodyx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Google Identity Services (GSI) for Google Account Chooser & Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body
  class="bg-[#0A0A0C] text-[#F8FAFC] antialiased overflow-hidden select-none font-['Plus_Jakarta_Sans',sans-serif] overscroll-none touch-manipulation">
  <div id="root">
    <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0A0C;color:#F8FAFC;font-family:'Plus Jakarta Sans',sans-serif;user-select:none;">
      <div style="width:96px;height:96px;border-radius:22px;overflow:hidden;box-shadow:0 20px 45px rgba(0,0,0,0.95);margin-bottom:16px;border:1px solid rgba(255,255,255,0.1);">
        <img src="/logo.png" alt="Melodyx" style="width:100%;height:100%;object-fit:cover;" />
      </div>
      <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:16px;background:linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 50%, #94A3B8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
        Melodyx
      </div>
      <div style="display:flex;gap:6px;align-items:center;height:24px;">
        <span style="width:4px;height:12px;background:linear-gradient(180deg,#FFFFFF,#94A3B8);border-radius:999px;"></span>
        <span style="width:4px;height:20px;background:linear-gradient(180deg,#FFFFFF,#CBD5E1);border-radius:999px;"></span>
        <span style="width:4px;height:24px;background:linear-gradient(180deg,#FFFFFF,#E2E8F0);border-radius:999px;"></span>
        <span style="width:4px;height:16px;background:linear-gradient(180deg,#FFFFFF,#CBD5E1);border-radius:999px;"></span>
        <span style="width:4px;height:8px;background:linear-gradient(180deg,#FFFFFF,#94A3B8);border-radius:999px;"></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
